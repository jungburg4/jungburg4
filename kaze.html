<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>風 — JUNGBURG</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Noto+Serif+JP:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0c0c0f; --white: #f4f4f8; --blue: #4a6fa5;
      --blue-light: #7ca3cc; --steel: #b8c8d8; --muted: #5a6070;
      --border: rgba(180,200,220,0.12);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black); color: var(--white);
      font-family: "Noto Serif JP", serif; font-weight: 300;
      overflow-x: hidden;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(100,150,200,0.05) 1px, transparent 1px);
      background-size: 30px 30px; pointer-events: none; z-index: 0;
    }
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 48px; height: 70px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px); background: rgba(12,12,15,0.85);
    }
    .logo-text {
      font-family: "Caveat", cursive; font-size: 1.5rem; font-weight: 500;
      color: var(--white); letter-spacing: 0.08em; text-decoration: none;
    }
    nav a {
      font-family: "Space Mono", monospace; font-size: 0.56rem;
      letter-spacing: 0.18em; color: var(--muted); text-decoration: none;
      margin-left: 28px; text-transform: uppercase; transition: color 0.3s;
    }
    nav a:hover { color: var(--blue-light); }
    footer {
      border-top: 1px solid var(--border); padding: 28px 48px;
      display: flex; justify-content: space-between; align-items: center;
      position: relative; z-index: 2;
    }
    .footer-logo-text {
      font-family: "Caveat", cursive; font-size: 1.1rem;
      font-weight: 500; color: var(--muted); letter-spacing: 0.08em;
    }
    .footer-copy {
      font-family: "Space Mono", monospace; font-size: 0.5rem;
      letter-spacing: 0.1em; color: var(--muted);
    }
    main {
      padding-top: 70px; position: relative; z-index: 2;
      min-height: 100vh;
    }
    .artist-hero {
      display: grid; grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 70px);
    }
    .artist-photo-wrap {
      position: relative; overflow: hidden;
      background: #0e121e;
    }
    .artist-photo {
      width: 100%; height: 100%; object-fit: cover;
      display: block; opacity: 0.9;
      transition: transform 0.6s ease;
    }
    .artist-photo-wrap:hover .artist-photo { transform: scale(1.03); }
    .artist-info {
      padding: 64px 56px;
      display: flex; flex-direction: column; justify-content: center;
      border-left: 1px solid var(--border);
    }
    .back-link {
      font-family: "Space Mono", monospace; font-size: 0.55rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
      margin-bottom: 48px; transition: color 0.3s;
    }
    .back-link:hover { color: var(--blue-light); }
    .section-label {
      font-family: "Space Mono", monospace; font-size: 0.55rem;
      letter-spacing: 0.28em; color: var(--blue-light);
      text-transform: uppercase; margin-bottom: 20px;
    }
    .artist-name-jp {
      font-family: "Caveat", cursive; font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 600; line-height: 1.1; margin-bottom: 6px;
    }
    .artist-name-en {
      font-family: "Space Mono", monospace; font-size: 0.65rem;
      letter-spacing: 0.2em; color: var(--muted);
      text-transform: uppercase; margin-bottom: 24px;
    }
    .artist-school {
      font-family: "Space Mono", monospace; font-size: 0.58rem;
      letter-spacing: 0.12em; color: var(--blue-light);
      margin-bottom: 28px;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
    .tag {
      font-family: "Space Mono", monospace; font-size: 0.5rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--steel); border: 1px solid rgba(124,163,204,0.3);
      padding: 4px 12px;
    }
    .divider {
      width: 40px; height: 1px; background: var(--blue);
      margin-bottom: 28px;
    }
    .artist-bio {
      font-size: 0.88rem; line-height: 2;
      color: var(--steel); white-space: pre-line;
    }
    .works-section {
      padding: 80px 48px; border-top: 1px solid var(--border);
      position: relative; z-index: 2;
    }
    .works-section-label {
      font-family: "Space Mono", monospace; font-size: 0.55rem;
      letter-spacing: 0.28em; color: var(--blue-light);
      text-transform: uppercase; margin-bottom: 12px;
    }
    .works-section-title {
      font-family: "Caveat", cursive; font-size: 2rem; font-weight: 600;
      margin-bottom: 40px;
    }
    .work-placeholder {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px;
    }
    .work-placeholder-item {
      aspect-ratio: 1; background: #0e121e;
      border: 1px dashed rgba(74,111,165,0.2);
      display: flex; align-items: center; justify-content: center;
    }
    .work-placeholder-item span {
      font-family: "Space Mono", monospace; font-size: 0.5rem;
      letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase;
    }
    @media (max-width: 768px) {
      header { padding: 0 20px; }
      nav { display: none; }
      .artist-hero { grid-template-columns: 1fr; }
      .artist-photo-wrap { aspect-ratio: 1; }
      .artist-info { padding: 40px 24px; }
      .works-section { padding: 60px 20px; }
      footer { flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
